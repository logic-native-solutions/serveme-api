spring:
  application:
    name: server-api
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth:
            true
          starttls:
            enable:
              true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASSNAME}

  jpa:
    hibernate:
      ddl-auto: update   # can be 'validate', 'create', 'create-drop', 'update', or 'none'
    show-sql: true
    properties:
      hibernate:
        dialect: ${JPA_DIALECT}

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: ${JWT_ACCESS_TOKEN}
    refreshTokenExpiration:  ${JWT_REFRESH_TOKEN}
    accessTokenExpiration: 100 # 5 min
    refreshTokenExpiration: 604800 # 7 days

arya:
  base-url: https://ping.arya.ai
  rsaid-path: /api/v1/rsaid
  face-verify-path: /api/v1/verifyFace
  id-api-key: ${ARYA_ID_INFO_EXTRACT_API_KEY}
  face-api-key: ${ARYA_FACE_VERIFY_API_KEY}
  timeout-ms: 30000